<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KF0ELQE2FH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-KF0ELQE2FH');
    </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área do Usuário</title>

  <link rel="stylesheet" href="/assets/css/sistema_base/basestyle.css">
  <link rel="stylesheet" href="/assets/css/sistema_base/headerstyle.css">
  <link rel="stylesheet" href="/assets/css/sistema_base/footerstyle.css">
  <link rel="stylesheet" href="/assets/css/sistema_base/tab_menustyle.css">
  <link rel="stylesheet" href="/assets/css/sistema_base/bookcardstyle.css">

  <link rel="stylesheet" href="/assets/css/pages/area_usuario.css">
  <link rel="stylesheet" href="/assets/css/sistema_base/cabecalho.css">

  <link rel="stylesheet" href="/assets/css/sistema_base/responsive.css">
</head>

<body>
  <!-- Header Global -->
  <header id="header"></header>
  <div id="cabecalho"></div>

  <div class="layout-com-sidebar">
    <main class="area-usuario conteudo-principal">

        <!-- TOPO -->
        <section class="perfil-topo">
        <img src="/assets/img/cabecalho/icone-avatar.svg" class="foto-perfil">

        <div>
            <h2>Nome do Usuário</h2>
        </div>
        </section>

        <!-- CARDS -->
        <section class="cards-acoes">
        <div class="card" data-target="editar">
            Editar
        </div>

        <div class="card" data-target="config">
            Configurações
        </div>

        <div class="card" data-target="publicacoes">
            Publicações
        </div>

        <div class="card" data-target="seguindo">
            Quem Eu Sigo
        </div>
        </section>

        <!-- EDITAR PERFIL -->
        <section id="editar" class="bloco oculto">
        <h3>Editar Perfil</h3>

        <form class="editar_perfil">
            <label class="texto">
            Nome
            <input type="text" class="campo" name="nome_usuario">
            </label>

            <label class="texto">
            Email
            <input type="email" class="campo" name="email">
            </label>

            <label class="texto">
            Foto
            <input type="file" accept="image/*" name="foto">
            </label>

            <button class="btn-salvar">Salvar</button>
        </form>
        </section>

        <!-- CONFIGURAÇÕES -->
        <section id="config" class="bloco oculto">
        <h3>Configurações</h3>

        <label>
            <input type="checkbox">
            Receber notificações
        </label>

        <button class="btn-salvar">Salvar</button>
        <button class="btn-logout">Logout</button>
        <button class="btn-excluir">Excluir Conta</button>
        </section>

        <!-- PUBLICAÇÕES -->
        <section id="publicacoes" class="bloco">
        <h3>Minhas Publicações</h3>

        <p>Você ainda não publicou nada. :((</p>

        <!--
        <div id="lista-livros"></div> 
        -->
        </section>

        <!-- SEGUINDO -->
        <section id="seguindo" class="bloco oculto">
        <h3>Usuários que eu sigo</h3>
        <div id="lista-seguindo">
            <p>Carregando...</p>
        </div>
        </section>
    </main>

    <aside class="sidebar-mensagens">
        <iframe src="/pages/mensagem.html" frameborder="0"></iframe>
    </aside>
  </div>

  <nav id="tab_menu"></nav>

  <!-- Footer Global -->
  <footer id="footer"></footer>
  
  <!-- carregando as páginas base -->
  <script src="/assets/js/core/api-config.js"></script>
  <script src="/assets/js/core/mensagem_sistema.js"></script>
  <script>
    const BASE_COMPONENTS = "/pages/components/";
  </script>

  <script src="/assets/js/core/carregar_paginas.js"></script>

  <script src="/assets/js/user/area_usuario.js"></script>
</body>

</html>
