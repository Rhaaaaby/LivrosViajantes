<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <meta name="description" content="Compartilhe e descubra livros que viajam pelo mundo!">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/assets/css/sistema_base/basestyle.css">
    <link rel="stylesheet" href="/assets/css/sistema_base/brandingstyle.css">
    <link rel="stylesheet" href="/assets/css/sistema_base/form_basestyle.css">
    <link rel="stylesheet" href="/assets/css/sistema_base/mensagem_sistema.css">
    <link rel="stylesheet" href="/assets/css/sistema_base/responsive.css">

    <style>
        body {
            background-color: #569FCA;
        }
    </style>
</head>

<body>
    <section>
        <div id="branding"></div>

        <form id="formLogin" class="form-container">
            <h1>Bem vindo de volta :)!</h1>

            <span>Login</span>

            <label for="email">E-mail</label>
            <input type="email" name="email" placeholder="Digite o seu melhor e-mail" required />

            <label for="senha">Senha</label>
            <input type="password" name="senha" placeholder="Digite sua senha" required />

            <button type="submit">
                Entrar
            </button>

            <a href="/pages/registrar.html"> Ainda não tem uma conta?</a>
        </form>

        <div id="mensagem-global" class="msg hidden"></div>
    </section>

    <script src="/assets/js/core/api-config.js"></script>
    <script>
        const BASE_COMPONENTS = "/assets/js/core/components/";
    </script>
    <script src="/assets/js/core/carregar_paginas.js"></script>
    <script src="/assets/js/core/base_forms.js"></script>
    <script src="/assets/js/core/mensagem_sistema.js"></script>

    <script>
        // Seleciona o formulário pelo ID
        const form = document.getElementById('formLogin');

        if (form) {
            form.addEventListener('submit', async (e) => {
                // IMPEDE O NAVEGADOR DE IR PARA A TELA DO JSON
                e.preventDefault();

                if (!form.email.value || !form.senha.value) {
                    mostrarMensagem("Preencha email e senha!", "erro");
                    return;
                }

                try {
                    const URLDados = new URLSearchParams();
                    URLDados.append('email', form.email.value.trim());
                    URLDados.append('senha', form.senha.value);

                    // 2. CORREÇÃO AQUI: Usamos a URL base dinâmica ou o fallback caso venha vazia da Render
                    const urlFinal = window.API_BASE ? `${window.API_BASE}/api/login` : `${window.location.origin}/api/login`;

                    const response = await fetch(urlFinal, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/x-www-form-urlencoded"
                        },
                        body: URLDados
                    });

                    const resultado = await response.json();

                    if (response.ok) {
                        localStorage.setItem("token", resultado.token);
                        localStorage.setItem("usuarioLogado", "true");
                        localStorage.setItem("usuarioNome", resultado.usuario.nome_usuario);
                        localStorage.setItem("usuario_id", resultado.usuario.id);

                        mostrarMensagem("Login realizado com sucesso!", "sucesso");

                        setTimeout(() => {
                            window.location.href = "/pages/index.php";
                        }, 1500);
                    } else {
                        mostrarMensagem(resultado.erro || "Email ou senha incorretos", "erro");
                    }
                } catch (erro) {
                    console.error(erro);
                    mostrarMensagem("Erro ao fazer login", "erro");
                }
            });
        } else {
            console.error("ERRO CRÍTICO: Não achei o id 'formLogin' neste HTML!");
        }
    </script>
</body>

</html>
