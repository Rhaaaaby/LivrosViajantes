  </header>

  <main class="notificacoes-container">

    <ul class="lista-notificacoes">

      <li class="notificacao-item">
        <span class="icone">📚</span>
        <div class="conteudo">
          <p class="mensagem">
            <strong>Fulano</strong> demonstrou interesse em um livro seu.
          </p>
          <span class="tempo">há 2 horas</span>
        </div>
      </li>

      <li class="notificacao-item">
        <span class="icone">💬</span>
        <div class="conteudo">
          <p class="mensagem">
            Você recebeu uma <strong>nova mensagem</strong>.
          </p>
          <span class="tempo">há 1 dia</span>
        </div>
      </li>

      <li class="notificacao-item">
        <span class="icone">✨</span>
        <div class="conteudo">
          <p class="mensagem">
            Sua publicação teve <strong>nova interação</strong>.
          </p>
          <span class="tempo">há 3 dias</span>
        </div>
      </li>

    </ul>
