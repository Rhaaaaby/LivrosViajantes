<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Notificações</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS global -->
  <link rel="stylesheet" href="./assets/css/sistema_base/basestyle.css">
  <link rel="stylesheet" href="./assets/css/sistema_base/headerstyle.css">
  <link rel="stylesheet" href="./assets/css/sistema_base/tab_menustyle.css">
  <link rel="stylesheet" href="./assets/css/sistema_base/footerstyle.css">

  <!-- CSS específico -->
  <link rel="stylesheet" href="./assets/css/pages/notificacao.css">
  <link rel="stylesheet" href="./assets/css/sistema_base/cabecalho.css">
  <link rel="stylesheet" href="./assets/css/sistema_base/mensagem_sistema.css">

  <link rel="stylesheet" href="./assets/css/sistema_base/responsive.css">
</head>
<body>
  <header id="header"></header>
  <div id="cabecalho"></div>

  <main class="notificacoes-container">

    <section class="notificacoes-section">
      <h2>Mensagens recebidas</h2>
      <ul id="lista-mensagens-recebidas" class="lista-notificacoes">
        <li class="notificacao-carregando">Carregando mensagens recebidas...</li>
      </ul>
    </section>

    <section class="notificacoes-section">
      <h2>Solicitações recebidas</h2>
      <ul id="lista-solicitacoes-recebidas" class="lista-notificacoes">
        <li class="notificacao-carregando">Carregando solicitações recebidas...</li>
      </ul>
    </section>

    <section class="notificacoes-section">
      <h2>Solicitações enviadas</h2>
      <ul id="lista-solicitacoes-enviadas" class="lista-notificacoes">
        <li class="notificacao-carregando">Carregando solicitações enviadas...</li>
      </ul>
    </section>

    <div id="notificacoes-vazio" class="notificacoes-vazio" >
      <p>🌙 Nenhuma solicitação encontrada por enquanto.</p>
    </div>

    <div id="notificacoes-mensagem" class="notificacoes-mensagem"></div>

    <nav id="tab_menu"></nav>

  </main>
  
  <footer id="footer"></footer>

  <!-- SCRIPTS -->
  <!-- carregando as páginas base --> 
  <!-- SCRIPTS -->
  <script src="./assets/js/core/api-config.js"></script>
  <script src="./assets/js/core/carregar_paginas.js"></script>
  <script src="./assets/js/core/mensagem_sistema.js"></script>
  <script src="./assets/js/notificacoes.js"></script>

</body>
</html>
