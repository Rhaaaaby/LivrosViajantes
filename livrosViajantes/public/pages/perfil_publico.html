<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Perfil Publico - Livros Viajantes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/livrosViajantes/public/assets/css/sistema_base/basestyle.css">
    <link rel="stylesheet" href="/livrosViajantes/public/assets/css/sistema_base/headerstyle.css">
    <link rel="stylesheet" href="/livrosViajantes/public/assets/css/sistema_base/cabecalho.css">
    <link rel="stylesheet" href="/livrosViajantes/public/assets/css/sistema_base/footerstyle.css">
    <link rel="stylesheet" href="/livrosViajantes/public/assets/css/sistema_base/tab_menustyle.css">
    <link rel="stylesheet" href="/livrosViajantes/public/assets/css/sistema_base/bookcardstyle.css">
    <link rel="stylesheet" href="/livrosViajantes/public/assets/css/pages/area_usuario.css">
    <link rel="stylesheet" href="/livrosViajantes/public/assets/css/pages/perfil_publico.css">
    <link rel="stylesheet" href="/livrosViajantes/public/assets/css/sistema_base/responsive.css">
</head>
<body>
    <header id="header"></header>
    <div id="cabecalho"></div>

    <main class="area-usuario perfil-publico">
        <section class="perfil-topo">
            <div class="perfil-publico-info">
                <img src="/livrosViajantes/public/assets/img/cabecalho/icone-avatar.svg" alt="Avatar" class="foto-perfil" id="perfilFoto">
                <div class="perfil-publico-textos">
                    <h2 id="perfilNome">Carregando...</h2>
                    <p id="perfilResumo">Perfil publico</p>
                </div>
            </div>
            <button id="btnSeguir" class="btn-seguir" hidden>Seguir</button>
        </section>

        <section class="cards-acoes" aria-label="Resumo do perfil">
            <div class="card" id="cardPublicacoes">Publicacoes</div>
            <div class="card" id="cardInteracao">Perfil publico</div>
        </section>

        <section id="publicacoes" class="bloco">
            <h3>Livros de <span id="perfilNomeLivros"></span></h3>
            <div class="lista-livros" id="livrosLista">
                <p class="perfil-publico-status">Carregando livros...</p>
            </div>
        </section>
    </main>

    <nav id="tab_menu"></nav>
    <footer id="footer"></footer>

    <script src="/livrosViajantes/public/assets/js/core/api-config.js"></script>
    <script src="/livrosViajantes/public/assets/js/core/carregar_paginas.js"></script>
    <script>
        function textoSeguro(valor, fallback = '') {
            return valor === null || valor === undefined || valor === '' ? fallback : String(valor);
        }

        function mostrarErroPerfil(texto) {
            document.querySelector('.perfil-publico').innerHTML = `<p class="perfil-publico-status">${texto}</p>`;
        }

        function criarCardLivro(livro) {
            const card = document.createElement('div');
            card.className = 'book-card';

            const imagem = livro.imagem
                ? `/livrosViajantes/public/${livro.imagem}`
                : '/livrosViajantes/public/assets/img/bookcard/livro-sonho.webp';

            card.innerHTML = `
                <img src="${imagem}" alt="Capa de ${textoSeguro(livro.titulo, 'livro')}" class="capa-livro">
                <div class="info-livro">
                    <h1 class="titulo-livro"></h1>
                    <span class="categoria"></span>
                    <p class="descricao-publicacao"></p>
                    <a href="/livrosViajantes/public/pages/publicacao_detalhada.html?id=${livro.id}">
                        <button class="btn-detalhes">Ver Detalhes</button>
                    </a>
                </div>
            `;

            card.querySelector('.titulo-livro').textContent = textoSeguro(livro.titulo, 'Livro sem titulo');
            card.querySelector('.categoria').textContent = textoSeguro(livro.categoria_nome, 'Sem categoria');
            card.querySelector('.descricao-publicacao').textContent = textoSeguro(livro.descricao, 'Sem descricao');

            return card;
        }

        function atualizarBotaoSeguir(btnSeguir, seguindo) {
            btnSeguir.textContent = seguindo ? 'Deixar de Seguir' : 'Seguir';
            btnSeguir.classList.toggle('seguindo', seguindo);
            btnSeguir.dataset.seguindo = seguindo ? '1' : '0';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const perfilId = params.get('id');

            if (!perfilId) {
                mostrarErroPerfil('Usuario nao encontrado.');
                return;
            }

            const token = localStorage.getItem('token');
            const headers = token ? { Authorization: `Bearer ${token}` } : {};

            try {
                const res = await fetch(`${API_BASE}/api/perfil-publico/${perfilId}`, { headers });
                const data = await res.json();

                if (!res.ok || data.sucesso === false) {
                    mostrarErroPerfil(data.erro || 'Nao foi possivel acessar este perfil.');
                    return;
                }

                const usuario = data.dados.usuario;
                const livros = data.dados.livros || [];
                const nomeUsuario = textoSeguro(usuario.nome_usuario, `Usuario ${usuario.id}`);

                document.getElementById('perfilNome').textContent = nomeUsuario;
                document.getElementById('perfilNomeLivros').textContent = nomeUsuario;
                document.getElementById('perfilResumo').textContent = `${livros.length} publicacao(oes)`;
                document.getElementById('cardPublicacoes').textContent = `${livros.length} publicacao(oes)`;

                if (usuario.foto) {
                    document.getElementById('perfilFoto').src = `/livrosViajantes/public/${usuario.foto}`;
                }

                const btnSeguir = document.getElementById('btnSeguir');
                const usuarioLogadoId = Number(localStorage.getItem('usuario_id'));
                const podeSeguir = token && usuarioLogadoId !== Number(perfilId);

                if (podeSeguir) {
                    btnSeguir.hidden = false;
                    document.getElementById('cardInteracao').textContent = data.dados.segue ? 'Seguindo' : 'Nao seguindo';
                    atualizarBotaoSeguir(btnSeguir, Boolean(data.dados.segue));

                    btnSeguir.addEventListener('click', async () => {
                        const seguindo = btnSeguir.dataset.seguindo === '1';
                        btnSeguir.disabled = true;

                        try {
                            const followRes = await fetch(`${API_BASE}/api/seguidores/${perfilId}`, {
                                method: seguindo ? 'DELETE' : 'POST',
                                headers: { Authorization: `Bearer ${token}` }
                            });
                            const followData = await followRes.json();

                            if (!followRes.ok || followData.sucesso === false) {
                                alert(followData.erro || 'Nao foi possivel atualizar esta acao.');
                                return;
                            }

                            atualizarBotaoSeguir(btnSeguir, !seguindo);
                            document.getElementById('cardInteracao').textContent = !seguindo ? 'Seguindo' : 'Nao seguindo';
                        } finally {
                            btnSeguir.disabled = false;
                        }
                    });
                } else {
                    document.getElementById('cardInteracao').textContent = token ? 'Seu perfil' : 'Visitante';
                }

                const livrosLista = document.getElementById('livrosLista');
                livrosLista.innerHTML = '';

                if (livros.length === 0) {
                    livrosLista.innerHTML = '<p class="perfil-publico-status">Este usuario ainda nao tem livros publicados.</p>';
                    return;
                }

                livros.forEach(livro => livrosLista.appendChild(criarCardLivro(livro)));
            } catch (error) {
                console.error(error);
                mostrarErroPerfil('Nao foi possivel acessar este perfil.');
            }
        });
    </script>
</body>
</html>
