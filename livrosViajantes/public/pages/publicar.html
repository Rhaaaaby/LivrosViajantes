<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <!-- SEO básico -->
    <title>Publicar</title>
    <meta name="description" content="Compartilhe e descubra livros que viajam pelo mundo!">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS BASE (sempre presente) -->
    <link rel="stylesheet" href="/livrosViajantes/public/assets/css/sistema_base/basestyle.css">
    <link rel="stylesheet" href="/livrosViajantes/public/assets/css/sistema_base/headerstyle.css">
    <link rel="stylesheet" href="/livrosViajantes/public/assets/css/sistema_base/footerstyle.css">
    <link rel="stylesheet" href="/livrosViajantes/public/assets/css/sistema_base/tab_menustyle.css">
    <!--CSS específico (formulários)-->
    <link rel="stylesheet" href="/livrosViajantes/public/assets/css/sistema_base/form_basestyle.css">
    <link rel="stylesheet" href="/livrosViajantes/public/assets/css/sistema_base/mensagem_sistema.css">

    <link rel="stylesheet" href="/livrosViajantes/public/assets/css/sistema_base/responsive.css">

</head>

<body>

    <!-- Header Global -->
    <header id="header"></header>

    <main>
        <form id="formPublicar" class="form-container form-livro" enctype="multipart/form-data"
            action="/livrosViajantes/public/api/publicar" method="POST">

            <h1>Nova Publicação</h1>

            <!-- Título -->
            <label for="titulo">Título</label>
            <input type="text" id="titulo" name="titulo" placeholder="Digite o título da publicação" required />

            <!-- Upload de Arquivos -->
            <label for="arquivo">Fazer upload de arquivos</label>
            <input type="file" id="arquivo" name="imagem" />

            <!-- Categorias -->
            <label for="categoria">Categorias</label>

            <select id="categoria" name="categoria_id" required>
                <option value="">Selecione uma categoria</option>
                <option value="1">Disponível</option>
                <option value="2">Emprestado</option>
                <option value="3">Doação</option>
            </select>

            <!-- Descrição -->
            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" placeholder="Escreva o conteúdo aqui" rows="5"></textarea>

            <!-- Botão -->
            <button type="submit">Publicar</button>
        </form>
    </main>

    <!-- Footer Global -->
    <footer id="footer"></footer>

    <!-- mensagens (sucesso, alerta, erro)-->
    <!-- <div id="mensagem-global" class="msg hidden"></div> -->

    <nav id="tab_menu"></nav>
    
    <!-- carregando as páginas -->
    <script src="/livrosViajantes/public/assets/js/core/api-config.js"></script>
    <script>
        const BASE_COMPONENTS = "/livrosViajantes/public/assets/js/core/components/";
    </script>
    <script src="/livrosViajantes/public/assets/js/core/carregar_paginas.js"></script>
    <script src="/livrosViajantes/public/assets/js/core/base_forms.js"></script>
    <script src="/livrosViajantes/public/assets/js/core/mensagem_sistema.js"></script>
    <!-- scripts específicos-->

    <script src="/livrosViajantes/public/assets/js/forms/publicar.js"></script>
</body>

</html>
