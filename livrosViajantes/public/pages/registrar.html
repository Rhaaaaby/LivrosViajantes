<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <!-- SEO básico -->
    <title>Registrar</title>
    <meta name="description" content="Compartilhe e descubra livros que viajam pelo mundo!">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS BASE (sempre presente) -->
    <link rel="stylesheet" href="/livrosViajantes/public/assets/css/sistema_base/basestyle.css">

    <!-- CSS específico (formulários)-->
    <link rel="stylesheet" href="/livrosViajantes/public/assets/css/sistema_base/brandingstyle.css">
    <link rel="stylesheet" href="/livrosViajantes/public/assets/css/sistema_base/form_basestyle.css">
    <link rel="stylesheet" href="/livrosViajantes/public/assets/css/sistema_base/mensagem_sistema.css">

    <link rel="stylesheet" href="/livrosViajantes/public/assets/css/sistema_base/responsive.css">
    <style> 
        body  {
            background-color: #569FCA; 
        }
    </style>

</head>

<body>
    <div id="branding"></div>

    <section>
        <form id="formRegistrar" class="form-container" action="/livrosViajantes/public/api/cadastrar" method="POST">

            <h1>Bem Vindo :D!</h1>

            <span>Vamos Começar?</span>

            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" placeholder="Digite o seu melhor e-mail" />

            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" placeholder="Vamos criar seu nome de usuário!" />

            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" placeholder="Digite sua senha" />

            <button type="submit">Criar Conta</button>

            <a href="/livrosViajantes/public/pages/login.html"> Já tem uma conta?</a>
        </form>

        <!-- mensagens (sucesso, alerta, erro)-->
        <div id="mensagem-global" class="msg hidden"></div>
    </section>

    <script>
        const BASE_COMPONENTS = "/livrosViajantes/public/assets/js/core/components/";
    </script>
    <script src="/livrosViajantes/public/assets/js/core/carregar_paginas.js"></script>
    <script src="/livrosViajantes/public/assets/js/core/base_forms.js"></script>
    <script src="/livrosViajantes/public/assets/js/core/mensagem_sistema.js"></script>
    <!-- scripts específicos -->
    <script src="/livrosViajantes/public/assets/js/forms/registrar.js"></script>
